<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de gastos + Spark Driver</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d6b58" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1917" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--text:#17302b;--muted:#5f726d;--border:#d5ded9;--accent:#1d6b58;--onaccent:#fff;--accbg:#e1efe9;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1917;--card:#17252a;--text:#e3eeea;--muted:#8fa59f;--border:#2b3f3b;--accent:#5fc4a5;--onaccent:#0f1917;--accbg:#183a31;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1917;--card:#17252a;--text:#e3eeea;--muted:#8fa59f;--border:#2b3f3b;--accent:#5fc4a5;--onaccent:#0f1917;--accbg:#183a31;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font:400 16px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;max-width:640px;padding:14px 14px 110px}
[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px;min-height:42px}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{width:100%;margin-top:14px;padding:9px 12px;min-height:46px;font:inherit;font-weight:600;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--onaccent)}
.btn2{flex:1;margin-top:14px;padding:9px 12px;min-height:42px;font:inherit;font-weight:600;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)}
.full{width:100%}
.link{background:none;border:0;color:var(--muted);padding:12px 0 0;font:inherit;font-size:14px;text-decoration:underline}
.muted{color:var(--muted);font-size:14px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.grid3 .k{min-width:0;padding:8px;overflow-wrap:anywhere}
.k{background:var(--bg);border-radius:8px;padding:8px 10px}.k b{display:block;font-size:19px;font-weight:600}.k span{font-size:12px;color:var(--muted)}
.k.hi{background:var(--accbg)}.k.hi b{color:var(--accent)}.k.wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.k.wide b{font-size:22px}
.k b.neg,.k.hi b.neg{color:var(--bad)}
.big{font-size:34px;font-weight:700;letter-spacing:-.01em;color:var(--accent)}.big.neg{color:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px;min-height:38px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);font-size:15px}
.row small{color:var(--muted);display:block}
.x{background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);font:inherit;font-size:13px;padding:6px 8px;min-height:36px}.x.armed,.link.armed{color:var(--bad);border-color:var(--bad)}.link.armed{text-decoration:none;padding:6px 10px;border-radius:6px;border:1px solid}
.neg{color:var(--bad)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);margin-top:12px}.chk input{width:auto;min-height:0;accent-color:var(--accent)}
.two{display:flex;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:12px;padding:4px 0;min-height:48px;border-radius:8px}
.tabs button.on{color:var(--accent);font-weight:600}.tabs button.on svg{background:var(--accbg);border-radius:12px}
@media (min-width:640px){.tabs{border:1px solid var(--border);border-bottom:0;border-radius:14px 14px 0 0}}
.tabs svg{width:24px;height:24px;padding:2px 12px;box-sizing:content-box}
.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
#msg{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:6;width:max-content;max-width:90%;margin:0 auto;padding:8px 12px;border-radius:8px;background:var(--accbg);color:var(--accent);font-size:14px;text-align:center;pointer-events:none}
#msg:empty{display:none}
#msg{box-shadow:0 4px 16px rgba(0,0,0,.12);border:1px solid var(--border)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 12px;min-height:56px}.tl{display:flex;align-items:center;gap:2px;min-width:0}.top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.2}.top span{display:block;color:var(--muted);font-size:14px}
.iconb{flex-shrink:0;background:none;border:0;color:var(--text);width:44px;height:44px;display:grid;place-items:center;border-radius:10px;padding:0}.iconb svg{width:24px;height:24px}.iconb:active{background:var(--accbg)}#back{margin-left:-10px}
.list{padding:0 14px}.mi{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--border);padding:12px 0;min-height:60px;font:inherit;color:var(--text);text-align:left}.list .mi:first-child{border-top:0}.mi b{font-weight:600}.mi small{display:block;color:var(--muted);font-size:13px}.mi svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.wk{margin-bottom:6px}.wk small{display:block;margin-top:2px;font-size:13px;font-weight:400;color:var(--muted)}
.card>h2+.btn2{margin-top:4px}
.btn:active,.btn2:active,.seg button:active{transform:scale(.98)}
.live{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.btn:active,.btn2:active,.seg button:active{transform:none}}
.hero{background:var(--accbg);border-radius:10px;padding:12px 14px}.hero .muted{margin:0;color:var(--text);opacity:.75}
.row>div:last-child{display:flex;align-items:center;gap:4px;flex-shrink:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
</style></head><body>
<header class="top"><div class="tl"><button class="iconb" id="back" aria-label="Atrás" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><div><h1 id="ttl">Mis cuentas</h1><span id="today"></span></div></div><button class="iconb" id="menub" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></header>
<nav class="tabs" aria-label="Secciones"><button data-t="work" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.644 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/></svg>Trabajo</button><button data-t="pers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>Personal</button></nav>
<div id="msg" role="status" aria-live="polite"></div>
<main id="work">
<section class="card" id="shift"></section>
<section class="card" id="stats"></section>
<section class="card"><h2>Gasolina</h2><div id="fillinfo"></div>
<button class="btn2 full" id="gt">+ Registrar llenada</button>
<div id="fform" hidden>
<label for="fo">Odómetro</label><input id="fo" inputmode="decimal" autocomplete="off">
<div class="pair"><div><label for="fg">Galones</label><input id="fg" inputmode="decimal" autocomplete="off"></div><div><label for="fp">Cuánto pagaste ($)</label><input id="fp" inputmode="decimal" autocomplete="off"></div></div>
<label class="chk"><input type="checkbox" id="ff" checked> Llené el tanque completo</label>
<button class="btn" id="addf">Guardar llenada</button>
<p class="muted">El cálculo usa ciclos entre llenadas completas. Si fue parcial, desmarca la casilla.</p></div></section>
</main>
<main id="pers" hidden>
<section class="card" id="psum"></section>
<section class="card"><h2>Gastos del mes</h2>
<button class="btn2 full" id="pt">+ Nuevo gasto</button>
<div id="pform" hidden><label for="pa">Monto ($)</label><input id="pa" inputmode="decimal" autocomplete="off">
<label for="pn">En qué (luz, mercado, tarjeta...)</label><input id="pn" autocomplete="off">
<button class="btn" id="addp">Agregar gasto</button></div>
<div id="plist"></div><p class="muted">No anotes aquí la gasolina del carro: ya se cuenta en Trabajo.</p></section>
</main>
<main id="menuv" hidden>
<section class="card list"><button class="mi" data-go="turnos"><span><b>Historial de turnos</b><small id="ms-turnos"></small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="mi" data-go="llenadas"><span><b>Llenadas de gasolina</b><small id="ms-llenadas"></small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="mi" data-go="reserva"><span><b>Reserva por milla</b><small id="ms-reserva"></small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="mi" data-go="copia"><span><b>Copia de seguridad</b><small id="ms-copia"></small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></section>
</main>
<main id="v-turnos" hidden><div id="list"></div></main>
<main id="v-llenadas" hidden><section class="card"><div id="fsum"></div><div id="fills"></div></section></main>
<main id="v-reserva" hidden><section class="card"><label for="rs">Dólares por milla para mantenimiento, llantas y reparaciones</label><input id="rs" inputmode="decimal" placeholder="Ej. 0.15"><button class="btn" id="saver">Guardar</button><p class="muted" id="rnow"></p><p class="muted" id="rtot"></p></section></main>
<main id="v-copia" hidden><section class="card"><div class="two"><button class="btn2" id="exp">Exportar</button><button class="btn2" id="impb">Importar</button></div><input type="file" id="imp" accept="application/json,.json" hidden><p class="muted">Importar suma lo que falte; nunca borra lo que ya tienes.</p></section></main>
<script>
//LOGIC-START
const KEY='sd_tracker_v1';
const RESERVA_MILLA=0.15; // $ por milla para mantenimiento, llantas y reparaciones (sin gasolina). Cambiarla solo afecta a los turnos NUEVOS.
const fin=n=>typeof n==='number'&&Number.isFinite(n);
const MPG_MIN=10,MPG_MAX=60; // rendimiento posible de un ciclo completo; fuera de esto se descarta
const num=v=>{if(v===null||v===undefined)return null;const t=String(v).trim().replace(',','.');if(!/^(\d+\.?\d*|\.\d+)$/.test(t))return null;const n=Number(t);return Number.isFinite(n)?n:null;};
const numO=v=>{const t=String(v==null?'':v).trim();return /^\d{1,3}(,\d{3})+$/.test(t)?num(t.replace(/,/g,'')):num(t);}; // odometro: 48,393 = 48393
const okd=d=>Number.isFinite(new Date(d).getTime());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const vs=s=>!!s&&fin(s.startOdo)&&fin(s.endOdo)&&fin(s.earned)&&s.earned>=0&&s.endOdo>s.startOdo&&okd(s.start)&&okd(s.end)&&new Date(s.end)>=new Date(s.start);
const vf=f=>!!f&&fin(f.odo)&&f.odo>=0&&fin(f.gal)&&f.gal>0&&fin(f.paid)&&f.paid>=0&&okd(f.date);
function gas(fills){const f=fills.filter(vf).sort((a,b)=>a.odo-b.odo);let last=null,gal=0,cost=0,mi=0,G=0,C=0,n=0,bad=0;const cyc=[];
 for(const x of f){if(last){gal+=x.gal;cost+=x.paid;}
  if(x.full!==false){if(last){const d=x.odo-last.odo,m=gal>0?d/gal:0,ok=d>0&&m>=MPG_MIN&&m<=MPG_MAX;cyc.push({from:last.odo,to:x.odo,mi:d,gal,cost,mpg:m,ok});if(ok){mi+=d;G+=gal;C+=cost;n++;}else bad++;}last=x;gal=0;cost=0;}}
 return n?{pending:false,cpm:C/mi,mpg:mi/G,n,bad,cyc}:{pending:true,n:0,bad,cyc};}
// Revisa una llenada nueva ANTES de guardarla. Devuelve un aviso (texto) o null si todo luce normal.
function checkFill(fills,nf){const b=gas(fills),a=gas(fills.concat([nf])),key=c=>c.from+'|'+c.to+'|'+c.gal.toFixed(3),old=new Set(b.cyc.map(key));
 const keep=new Set(a.cyc.map(key)),good=b.cyc.filter(c=>c.ok&&keep.has(key(c))).map(c=>c.mpg).sort((x,y)=>x-y),k=good.length,med=k?(k%2?good[(k-1)/2]:(good[k/2-1]+good[k/2])/2):null;
 for(const c of a.cyc.filter(c=>!old.has(key(c)))){
  if(!c.ok)return 'Con la llenada anterior da '+c.mpg.toFixed(1)+' MPG, fuera de lo normal; si la guardas, ese ciclo no entra al cálculo.';
  if(med&&(c.mpg<med*0.6||c.mpg>med*1.5))return 'Da '+c.mpg.toFixed(1)+' MPG y tu promedio es '+med.toFixed(1)+'. ¿Olvidaste una llenada o el odómetro está mal?';}
 return null;}
function period(kind,ref){const d=new Date(ref||Date.now());d.setHours(0,0,0,0);const a=new Date(d);let b;
 if(kind==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a);b.setDate(b.getDate()+7);}
 else if(kind==='day'){b=new Date(a);b.setDate(b.getDate()+1);}
 else{a.setDate(1);b=new Date(a);b.setMonth(b.getMonth()+1);}
 return[a,b];}
const inP=(iso,p)=>{const t=new Date(iso).getTime();return t>=p[0].getTime()&&t<p[1].getTime();};
function sc(s){const mi=s.endOdo-s.startOdo,h=(new Date(s.end)-new Date(s.start))/36e5;
 const gc=fin(s.cpm)?mi*s.cpm:null,rv=fin(s.reserve)&&s.reserve>=0?s.reserve:0;
 return{mi,h,e:s.earned,gc,rv,net:gc!==null?s.earned-gc-rv:null};}
function sumP(D,p){const r={n:0,e:0,mi:0,h:0,gc:0,rv:0,net:0,ng:0,nn:0};
 D.shifts.filter(s=>vs(s)&&inP(s.start,p)).map(sc).forEach(x=>{r.n++;r.e+=x.e;r.mi+=x.mi;r.h+=x.h;r.rv+=x.rv;
  if(x.gc!==null){r.gc+=x.gc;r.net+=x.net;}else{r.ng++;r.nn++;}});
 r.complete=r.nn===0;return r;}
function resTotal(D){return D.shifts.filter(vs).reduce((a,s)=>a+sc(s).rv,0);}
function norm(raw){const o=raw&&typeof raw==='object'?raw:{},A=a=>Array.isArray(a)?a:[],ob=x=>x&&typeof x==='object',st=ob(o.set)?o.set:{};
 return{v:2,active:ob(o.active)&&fin(o.active.startOdo)&&okd(o.active.start)?{start:o.active.start,startOdo:o.active.startOdo}:null,
 shifts:A(o.shifts).filter(ob).map(s=>({...s,id:s.id||uid()})),
 fills:A(o.fills).filter(ob).map(f=>({...f,id:f.id||uid(),full:f.full!==false})),
 personal:A(o.personal).filter(ob).map(p=>({...p,id:p.id||uid(),type:p.type==='ingreso'?'ingreso':'gasto'})),
 range:['day','week','month'].includes(o.range)?o.range:'week',
 set:{reserva:fin(st.reserva)&&st.reserva>=0&&st.reserva<=5?st.reserva:null}};}
const rate=D=>fin(D.set&&D.set.reserva)?D.set.reserva:RESERVA_MILLA;
// Devuelve cuántos valores completó. Solo rellena lo que falta; nunca sobrescribe una reserva o un costo de gasolina ya guardados (0 también cuenta como guardado).
function migrate(D){let c=0;const g=gas(D.fills);if(!g.pending)D.shifts.forEach(s=>{if(!fin(s.cpm)){s.cpm=g.cpm;s.mpg=g.mpg;c++;}});
 D.shifts.forEach(s=>{if(!fin(s.reserve)&&vs(s)){s.reserve=(s.endOdo-s.startOdo)*rate(D);c++;}});return c;}
// Carga los datos, migra y, si la migración cambió algo, lo GUARDA de inmediato. Antes de la primera escritura deja una copia intacta de lo que había.
function loadState(st){let D,raw=null;
 try{raw=st.getItem(KEY);if(raw&&!st.getItem(KEY+'_pre2'))st.setItem(KEY+'_pre2',raw);if(raw&&!st.getItem(KEY+'_pre3'))st.setItem(KEY+'_pre3',raw);D=norm(raw?JSON.parse(raw):null);}catch(e){D=norm(null);}
 const c=migrate(D);
 if(c>0&&raw){try{if(!st.getItem(KEY+'_pre_migracion'))st.setItem(KEY+'_pre_migracion',raw);st.setItem(KEY,JSON.stringify(D));}catch(e){}}
 return D;}
function mergeIn(D,raw){const N=norm(raw);['shifts','fills','personal'].forEach(k=>{const ids=new Set(D[k].map(x=>x.id));N[k].forEach(x=>{if(!ids.has(x.id)){D[k].push(x);ids.add(x.id);}});});
 if(D.set&&D.set.reserva===null&&N.set)D.set.reserva=N.set.reserva;
 if(!D.active&&N.active)D.active=N.active;return D;}
//LOGIC-END
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'-$':'$')+Math.abs(n).toFixed(2);
const tf=i=>new Date(i).toLocaleTimeString('es-US',{hour:'numeric',minute:'2-digit'});
const df=i=>new Date(i).toLocaleDateString('es-US',{weekday:'short',day:'numeric',month:'short'});
let S;
try{S=loadState(localStorage);}catch(e){S=norm(null);migrate(S);}
S.range='day';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar en este navegador');}}
let tt;function toast(t,ms){clearTimeout(tt);$('msg').textContent=t;tt=setTimeout(()=>{$('msg').textContent='';},ms||3500);}
function arm(b,fn){let a=false;b.onclick=()=>{if(a){fn();return;}a=true;b.textContent='¿Seguro?';b.classList.add('armed');setTimeout(()=>{a=false;b.textContent=b.dataset.l;b.classList.remove('armed');},2500);};}
function tick(){const el=$('el');if(!el||!S.active)return;const m=Math.max(0,Math.floor((Date.now()-new Date(S.active.start))/6e4));el.textContent=Math.floor(m/60)+' h '+(m%60)+' min';}
setInterval(tick,20000);
function rShift(){const a=S.active;$('shift').classList.toggle('live',!!a);
if(!a){$('shift').innerHTML='<h2>Turno</h2><label for="so">Odómetro al salir de casa</label><input id="so" inputmode="decimal" autocomplete="off" placeholder="Ej. 84250"><button class="btn" id="go">Empezar turno</button>';
$('go').onclick=()=>{const o=numO($('so').value);if(o===null||o<0)return toast('Pon un odómetro válido');const me=Math.max(0,...S.shifts.filter(vs).map(s=>s.endOdo));if(o<me)return toast('El odómetro es menor al del último turno ('+me+')');S.active={start:new Date().toISOString(),startOdo:o};save();rAll();};}
else{$('shift').innerHTML='<h2><span class="dot" aria-hidden="true"></span>Turno en curso</h2><p class="muted">Empezó a las '+tf(a.start)+' · <span id="el"></span> · salió con '+a.startOdo+' mi</p><label for="eo">Odómetro al llegar a casa</label><input id="eo" inputmode="decimal" autocomplete="off"><label for="ea">Ganancia del día ($)</label><input id="ea" inputmode="decimal" autocomplete="off"><button class="btn" id="fin">Terminar turno</button><button class="link" id="can" data-l="Cancelar turno">Cancelar turno</button>';tick();
$('fin').onclick=()=>{const o=numO($('eo').value),e=num($('ea').value);if(o===null||o<=a.startOdo)return toast('El odómetro final debe ser mayor al inicial');if(o-a.startOdo>1000)return toast('Más de 1,000 millas en un turno: revisa el odómetro');if(e===null||e<0)return toast('Pon lo que ganaste (0 o más)');
const g=gas(S.fills);S.shifts.push({id:uid(),start:a.start,end:new Date().toISOString(),startOdo:a.startOdo,endOdo:o,earned:e,cpm:g.pending?null:g.cpm,mpg:g.pending?null:g.mpg,reserve:(o-a.startOdo)*rate(S)});S.active=null;save();rAll();toast('Turno guardado');};
arm($('can'),()=>{S.active=null;save();rAll();});}}
function rStats(){const p=period(S.range),x=sumP(S,p),g=gas(S.fills);
const nph=x.complete&&x.n>0&&x.h>0?x.net/x.h:null,bph=x.h>0?x.e/x.h:null;
const gv=x.n===0?'—':(x.ng===x.n?'Pendiente':money(x.gc)+(x.ng?'*':''));
const K=(l,v,c)=>'<div class="k'+(c?' '+c:'')+'"><span>'+l+'</span><b'+(String(v)[0]==='-'?' class="neg"':'')+'>'+v+'</b></div>';
const R=[['day','Hoy'],['week','Semana'],['month','Mes']];
let h='<div class="seg">'+R.map(r=>'<button data-r="'+r[0]+'" class="'+(S.range===r[0]?'on':'')+'">'+r[1]+'</button>').join('')+'</div>';
h+='<div class="hero"><p class="muted">Ganancia neta por hora (estimada)</p><div class="big'+(nph!==null&&nph<0?' neg':'')+'">'+(nph!==null?money(nph):(x.n?'Pendiente':'—'))+'</div></div>';
h+='<div class="grid">'+K('Ganado',money(x.e))+K('Gasolina (est.)',gv)+K('Reserva',x.n===0?'—':money(x.rv))+K('Neto',x.n===0?'—':(x.complete?money(x.net):'Pendiente'),'hi')+'</div>';
h+=x.n?'<div class="grid3">'+K('Horas',x.h.toFixed(1))+K('Millas',Math.round(x.mi))+K('Bruto/h',bph!==null?money(bph):'—')+'</div>':'<p class="muted">Aún no hay turnos en este periodo.</p>';
if(x.n&&g.pending)h+='<p class="muted">Gasolina pendiente: necesito 2 llenadas completas seguidas con datos consistentes.'+(g.bad?' ('+g.bad+' ciclo(s) descartado(s) por inconsistentes.)':'')+'</p>';
else if(x.ng&&x.ng<x.n)h+='<p class="muted">* '+x.ng+' turno(s) sin gasolina estimada.</p>';
$('stats').innerHTML=h;
$('stats').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;save();rAll();});}
function rFill(){const g=gas(S.fills);
$('fillinfo').innerHTML=g.pending?'<p class="muted">Estimación pendiente: con 2 llenadas completas seguidas calculo tu costo por milla.'+(g.bad?' ('+g.bad+' descartada(s) por inconsistentes.)':'')+'</p>':'<p class="muted"><b>'+g.mpg.toFixed(1)+' MPG</b> · '+money(g.cpm)+' por milla · '+g.n+' ciclo(s)'+(g.bad?' · '+g.bad+' descartado(s)':'')+'</p>';}
function rHist(){const l=S.shifts.filter(vs).sort((a,b)=>new Date(b.start)-new Date(a.start)),f=[...S.fills].filter(vf).sort((a,b)=>b.odo-a.odo),g=gas(S.fills),cw=period('week')[0].getTime();
const W=[];l.forEach(s=>{const k=period('week',s.start)[0].getTime();let w=W[W.length-1];if(!w||w.k!==k)W.push(w={k,s:[]});w.s.push(s);});
$('list').innerHTML=W.length?W.map(w=>{const C=w.s.map(sc),e=C.reduce((a,c)=>a+c.e,0),ok=C.every(c=>c.net!==null),net=C.reduce((a,c)=>a+(c.net||0),0);
 return '<section class="card"><h2 class="wk">'+(w.k===cw?'Esta semana':'Semana del '+new Date(w.k).toLocaleDateString('es-US',{day:'numeric',month:'short'}))+'<small>'+w.s.length+' turno(s) · '+money(e)+(ok?' · neto '+money(net):'')+'</small></h2>'+
 w.s.map((s,i)=>{const c=C[i];return '<div class="row"><div>'+df(s.start)+'<small>'+c.mi+' mi · '+c.h.toFixed(1)+' h · '+(c.net!==null?'neto '+money(c.net):'neto pendiente')+'</small></div><div><b>'+money(s.earned)+'</b> <button class="x" data-l="Borrar" data-d="'+s.id+'">Borrar</button></div></div>';}).join('')+'</section>';}).join(''):'<section class="card"><p class="muted">Aún no hay turnos.</p></section>';
$('fsum').innerHTML=$('fillinfo').innerHTML;
$('ms-turnos').textContent=l.length?l.length+' turno(s)':'Sin turnos';
$('ms-llenadas').textContent=g.pending?(f.length?f.length+' llenada(s)':'Sin llenadas'):g.mpg.toFixed(1)+' MPG · '+money(g.cpm)+' por milla';
$('ms-reserva').textContent=money(rate(S))+' por milla · '+money(resTotal(S))+' acumulado';
$('ms-copia').textContent='Exportar o importar tus datos';
$('list').querySelectorAll('[data-d]').forEach(b=>arm(b,()=>{S.shifts=S.shifts.filter(x=>x.id!==b.dataset.d);save();rAll();}));
$('fills').innerHTML=f.length?f.map(x=>'<div class="row"><div>'+df(x.date)+'<small>'+x.odo+' mi · '+x.gal+' gal'+(x.full===false?' · parcial':'')+'</small></div><div><b>'+money(x.paid)+'</b> <button class="x" data-l="Borrar" data-f="'+x.id+'">Borrar</button></div></div>').join(''):'<p class="muted">Aún no hay llenadas.</p>';
$('fills').querySelectorAll('[data-f]').forEach(b=>arm(b,()=>{S.fills=S.fills.filter(x=>x.id!==b.dataset.f);save();rAll();}));
$('rs').value=fin(S.set.reserva)?S.set.reserva:'';
$('rnow').textContent='Ahora: '+money(rate(S))+' por milla. Aplica solo a turnos nuevos; los anteriores conservan la suya.';
$('rtot').textContent='Reserva acumulada de todos los turnos: '+money(resTotal(S));}
function rPers(){const p=period('month'),x=sumP(S,p),P=S.personal.filter(i=>fin(i.amount)&&okd(i.date)&&inP(i.date,p));
const pt=P.reduce((a,i)=>a+i.amount,0),left=x.complete?x.net-pt:null;
const K=(l,v,c)=>'<div class="k'+(c?' '+c:'')+'"><span>'+l+'</span><b'+(String(v)[0]==='-'?' class="neg"':'')+'>'+v+'</b></div>';
$('psum').innerHTML='<h2>Resumen de '+p[0].toLocaleDateString('es-US',{month:'long',year:'numeric'})+'</h2><div class="grid">'+K('Ganado (Spark)',money(x.e))+K('Gasolina (est.)',x.n===0?money(0):(x.ng===x.n?'Pendiente':money(x.gc)+(x.ng?'*':'')))+K('Reserva de desgaste',money(x.rv))+K('Gastos personales',money(pt))+K('Te queda (est.)',left!==null?money(left):'Pendiente','hi wide')+'</div><p class="muted">Es una estimación, no tu saldo bancario.</p>';
const l=[...P].sort((a,b)=>new Date(b.date)-new Date(a.date));
$('plist').innerHTML=l.length?l.map(i=>'<div class="row"><div>'+esc(i.note||'Gasto')+'<small>'+df(i.date)+'</small></div><div><b>'+money(i.amount)+'</b> <button class="x" data-l="Borrar" data-p="'+i.id+'">Borrar</button></div></div>').join(''):'<p class="muted">Aún no hay gastos este mes.</p>';
$('plist').querySelectorAll('[data-p]').forEach(b=>arm(b,()=>{S.personal=S.personal.filter(x=>x.id!==b.dataset.p);save();rAll();}));}
let fw=null;
$('addf').onclick=()=>{const o=numO($('fo').value),gl=num($('fg').value),p=num($('fp').value);
if(o===null||o<0||gl===null||gl<=0||p===null||p<0)return toast('Llena odómetro, galones y lo que pagaste');
const pg=p/gl;if(pg<0.5||pg>15)return toast('Revisa galones y monto: el precio por galón sale raro');
if(S.fills.some(f=>f.odo===o))return toast('Ya hay una llenada con ese odómetro');
const nf={id:uid(),date:new Date().toISOString(),odo:o,gal:gl,paid:p,full:$('ff').checked},w=checkFill(S.fills,nf),sig=[o,gl,p,nf.full].join('|');
if(w&&fw!==sig){fw=sig;return toast(w+' Si es correcto, toca Guardar llenada otra vez.',9000);}
fw=null;S.fills.push(nf);['fo','fg','fp'].forEach(i=>$(i).value='');$('ff').checked=true;$('fform').hidden=true;$('gt').textContent='+ Registrar llenada';migrate(S);save();rAll();toast('Llenada guardada');};
$('addp').onclick=()=>{const a=num($('pa').value);if(a===null||a<=0)return toast('Pon un monto mayor a 0');S.personal.push({id:uid(),date:new Date().toISOString(),amount:a,note:$('pn').value.trim()});$('pa').value='';$('pn').value='';$('pform').hidden=true;$('pt').textContent='+ Nuevo gasto';save();rAll();toast('Guardado');};
$('exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='gastos-spark-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);};
$('impb').onclick=()=>$('imp').click();
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j!=='object'||!['shifts','fills','personal'].some(k=>Array.isArray(j[k])))throw 0;const n0=S.shifts.length+S.fills.length+S.personal.length;mergeIn(S,j);migrate(S);save();rAll();toast('Importado: '+(S.shifts.length+S.fills.length+S.personal.length-n0)+' registro(s) nuevo(s)');}catch(x){toast('Archivo no válido');}e.target.value='';};r.readAsText(f);};
$('gt').onclick=()=>{const f=$('fform');f.hidden=!f.hidden;$('gt').textContent=f.hidden?'+ Registrar llenada':'Cerrar';};
$('pt').onclick=()=>{const f=$('pform');f.hidden=!f.hidden;$('pt').textContent=f.hidden?'+ Nuevo gasto':'Cerrar';};

// Navegación: Trabajo y Personal son pestañas; el menú y sus páginas usan el historial del navegador para que el gesto de "atrás" funcione.
const HV={'':'work','#personal':'pers','#menu':'menu','#turnos':'turnos','#llenadas':'llenadas','#reserva':'reserva','#copia':'copia'};
const VID={work:'work',pers:'pers',menu:'menuv',turnos:'v-turnos',llenadas:'v-llenadas',reserva:'v-reserva',copia:'v-copia'};
const TTL={menu:'Menú',turnos:'Historial de turnos',llenadas:'Llenadas de gasolina',reserva:'Reserva por milla',copia:'Copia de seguridad'};
const fromHash=()=>HV[location.hash]||'work';
let view=fromHash(),lastTab=view==='pers'?'pers':'work';
const vurl=v=>v==='work'?location.pathname+location.search:'#'+(v==='pers'?'personal':v);
function go(v,push){if(v==='work'||v==='pers')lastTab=v;if(push)history.pushState({p:1},'',vurl(v));else history.replaceState(null,'',vurl(v));view=v;rView();window.scrollTo(0,0);}
function rView(){const sub=!!TTL[view];Object.keys(VID).forEach(k=>$(VID[k]).hidden=k!==view);
 document.querySelector('.tabs').hidden=sub;$('back').hidden=!sub;$('menub').hidden=sub;$('today').hidden=sub;$('ttl').textContent=sub?TTL[view]:'Mis cuentas';document.title=sub?TTL[view]+' · Mis cuentas':'Control de gastos + Spark Driver';
 document.querySelectorAll('.tabs button').forEach(b=>{const on=b.dataset.t===view;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t,false));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,true));
$('menub').onclick=()=>go('menu',true);
$('back').onclick=()=>{if(history.state&&history.state.p)history.back();else go(view==='menu'?lastTab:'menu',false);};
window.addEventListener('popstate',()=>{view=fromHash();if(view==='work'||view==='pers')lastTab=view;rView();});
function rAll(){rShift();rStats();rFill();rHist();rPers();rView();}
$('today').textContent=new Date().toLocaleDateString('es-US',{weekday:'long',day:'numeric',month:'long'});
rAll();
