<script>
//LOGIC-START
const KEY='sd_tracker_v1';
const RESERVA_MILLA=0.15; // $ por milla para mantenimiento, llantas y reparaciones (sin gasolina). Cambiarla solo afecta a los turnos NUEVOS.
const fin=n=>typeof n==='number'&&Number.isFinite(n);
const MPG_MIN=10,MPG_MAX=60; // rendimiento posible de un ciclo completo; fuera de esto se descarta
const num=v=>{if(v===null||v===undefined)return null;const t=String(v).trim().replace(',','.');if(!/^(\d+\.?\d*|\.\d+)$/.test(t))return null;const n=Number(t);return Number.isFinite(n)?n:null;};
const numO=v=>{const t=String(v==null?'':v).trim();return /^\d{1,3}(,\d{3})+$/.test(t)?num(t.replace(/,/g,'')):num(t);}; // odometro: 48,393 = 48393
const okd=d=>Number.isFinite(new Date(d).getTime());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const vs=s=>!!s&&fin(s.startOdo)&&fin(s.endOdo)&&fin(s.earned)&&s.earned>=0&&s.endOdo>s.startOdo&&okd(s.start)&&okd(s.end)&&new Date(s.end)>=new Date(s.start);
const vf=f=>!!f&&fin(f.odo)&&f.odo>=0&&fin(f.gal)&&f.gal>0&&fin(f.paid)&&f.paid>=0&&okd(f.date);
function gas(fills){const f=fills.filter(vf).sort((a,b)=>a.odo-b.odo);let last=null,gal=0,cost=0,mi=0,G=0,C=0,n=0,bad=0;const cyc=[];
 for(const x of f){if(last){gal+=x.gal;cost+=x.paid;}
  if(x.full!==false){if(last){const d=x.odo-last.odo,m=gal>0?d/gal:0,ok=d>0&&m>=MPG_MIN&&m<=MPG_MAX;cyc.push({from:last.odo,to:x.odo,mi:d,gal,cost,mpg:m,ok});if(ok){mi+=d;G+=gal;C+=cost;n++;}else bad++;}last=x;gal=0;cost=0;}}
 return n?{pending:false,cpm:C/mi,mpg:mi/G,n,bad,cyc}:{pending:true,n:0,bad,cyc};}
// Revisa una llenada nueva ANTES de guardarla. Devuelve un aviso (texto) o null si todo luce normal.
function checkFill(fills,nf){const b=gas(fills),a=gas(fills.concat([nf])),key=c=>c.from+'|'+c.to+'|'+c.gal.toFixed(3),old=new Set(b.cyc.map(key));
 const keep=new Set(a.cyc.map(key)),good=b.cyc.filter(c=>c.ok&&keep.has(key(c))).map(c=>c.mpg).sort((x,y)=>x-y),k=good.length,med=k?(k%2?good[(k-1)/2]:(good[k/2-1]+good[k/2])/2):null;
 for(const c of a.cyc.filter(c=>!old.has(key(c)))){
  if(!c.ok)return 'Con la llenada anterior da '+c.mpg.toFixed(1)+' MPG, fuera de lo normal; si la guardas, ese ciclo no entra al cálculo.';
  if(med&&(c.mpg<med*0.6||c.mpg>med*1.5))return 'Da '+c.mpg.toFixed(1)+' MPG y tu promedio es '+med.toFixed(1)+'. ¿Olvidaste una llenada o el odómetro está mal?';}
 return null;}
function period(kind,ref){const d=new Date(ref||Date.now());d.setHours(0,0,0,0);const a=new Date(d);let b;
 if(kind==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a);b.setDate(b.getDate()+7);}

const VID={work:'work',pers:'pers',menu:'menuv',turnos:'v-turnos',llenadas:'v-llenadas',reserva:'v-reserva',copia:'v-copia',gastos:'v-gastos',llenada:'v-llenada',gasto:'v-gasto',editar:'v-editar'};
const TTL={menu:'Menú',turnos:'Historial de turnos',llenadas:'Llenadas de gasolina',reserva:'Reserva por milla',copia:'Copia de seguridad',gastos:'Gastos personales',llenada:'Registrar llenada',gasto:'Nuevo gasto',editar:'Editar'};
const fromHash=()=>{const v=HV[location.hash]||'work';return v==='editar'&&!ed?'menu':v;}; // sin registro elegido (p. ej. al recargar) no hay nada que editar
const parentOf=v=>v==='menu'||v==='llenada'?lastTab:v==='gasto'?'pers':v==='editar'?(ed&&ed.from)||'menu':'menu';
function goBack(){if(history.state&&history.state.p)history.back();else go(parentOf(view),false);}
const UIK=KEY+'_tab',getTab=()=>{try{return localStorage.getItem(UIK)==='pers'?'pers':'work';}catch(e){return 'work';}},putTab=v=>{try{localStorage.setItem(UIK,v);}catch(e){}};
let view=location.hash?fromHash():getTab(),lastTab=view==='pers'?'pers':(TTL[view]?getTab():'work');
const vurl=v=>v==='work'?location.pathname+location.search:'#'+(v==='pers'?'personal':v);
if(!location.hash&&view==='pers')history.replaceState(null,'',vurl('pers'));
if(location.hash==='#editar')history.replaceState(null,'',vurl(view));
function anim(c){const el=$(VID[view]);el.classList.remove('enter','back');void el.offsetWidth;el.classList.add(c);}
function go(v,push){if(v==='work'||v==='pers'){lastTab=v;putTab(v);}if(push)history.pushState({p:1},'',vurl(v));else history.replaceState(null,'',vurl(v));const prev=view;view=v;rView();$('app').scrollTo(0,0);if(TTL[v]&&(push||!TTL[prev]))anim('enter');else if(TTL[prev])anim('back');}
function rView(){const sub=!!TTL[view];Object.keys(VID).forEach(k=>$(VID[k]).hidden=k!==view);
 document.querySelector('.tabs').hidden=sub;$('back').hidden=!sub;$('menub').hidden=sub;$('today').hidden=sub;const tt=view==='editar'&&ed?EDT[ed.k]:TTL[view];$('ttl').textContent=sub?tt:'Mis cuentas';document.title=sub?tt+' · Mis cuentas':'Control de gastos + Spark Driver';
 const ab=$('actb');ab.hidden=sub;if(!sub){const f=view==='work';ab.setAttribute('aria-label',f?'Registrar llenada':'Nuevo gasto');ab.innerHTML=f?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h12"/><path d="M4 9h10"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';}
 document.querySelectorAll('.tabs button').forEach(b=>{const on=b.dataset.t===view;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t,false));
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,true));
$('menub').onclick=()=>go('menu',true);
$('back').onclick=goBack;
$('actb').onclick=()=>{fw=null;go(view==='pers'?'gasto':'llenada',true);};
window.addEventListener('popstate',()=>{view=fromHash();if(view==='work'||view==='pers'){lastTab=view;putTab(view);}rView();anim('back');});
$('app').addEventListener('scroll',()=>$('top').classList.toggle('sc',$('app').scrollTop>4),{passive:true});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
function rAll(){rShift();rStats();rFill();rHist();rPers();rView();}
$('today').textContent=new Date().toLocaleDateString('es-US',{weekday:'long',day:'numeric',month:'long'});
rAll();
</script></body></html>
