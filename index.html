<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de gastos + Spark Driver</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7a4d">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#151a21;--muted:#6a7280;--accent:#0b7a4d;--onaccent:#fff;--border:#e1e5ea;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1217;--card:#19202a;--text:#edf0f4;--muted:#9aa4b1;--accent:#2dc08a;--onaccent:#06150e;--border:#29323e;--bad:#f0705f}}
:root[data-theme="dark"]{--bg:#0e1217;--card:#19202a;--text:#edf0f4;--muted:#9aa4b1;--accent:#2dc08a;--onaccent:#06150e;--border:#29323e;--bad:#f0705f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;padding:0 12px 40px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:8px;padding:10px 0;background:var(--bg);z-index:5}
.tabs button{flex:1;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-weight:600;font-size:16px}
.tabs button.on,.seg button.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:12px;font-size:17px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
.btn{width:100%;margin-top:14px;padding:14px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--accent);color:var(--onaccent)}
.link{background:none;border:0;color:var(--muted);padding:12px 0 0;font-size:14px;text-decoration:underline}
.muted{color:var(--muted);font-size:14px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.k{background:var(--bg);border-radius:12px;padding:10px}.k b{display:block;font-size:19px}.k span{font-size:12px;color:var(--muted)}
.big{font-size:34px;font-weight:800}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);font-size:15px}
.row small{color:var(--muted);display:block}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:6px}
.neg{color:var(--bad)}
#msg{min-height:20px;color:var(--accent);font-size:14px;text-align:center}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);margin-top:12px}.chk input{width:auto}
.two{display:flex;gap:8px}.btn2{flex:1;margin-top:14px;padding:14px;font-size:16px;font-weight:600;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
</style></head><body>
<div class="tabs"><button data-t="work" class="on">Trabajo</button><button data-t="pers">Personal</button></div>
<div id="msg"></div>
<main id="work">
<section class="card" id="shift"></section>
<section class="card" id="stats"></section>
<section class="card" id="resv"></section>
<section class="card"><h2>Gasolina</h2>
<label>Odómetro</label><input id="fo" inputmode="decimal">
<label>Galones</label><input id="fg" inputmode="decimal">
<label>Cuánto pagaste ($)</label><input id="fp" inputmode="decimal">
<label class="chk"><input type="checkbox" id="ff" checked> Llené el tanque completo</label>
<button class="btn" id="addf">Guardar llenada</button>
<p class="muted">El cálculo usa ciclos entre llenadas completas. Si fue parcial, desmarca la casilla.</p>
<div id="fillinfo"></div><div id="fills"></div></section>
<section class="card"><h2>Últimos turnos</h2><div id="list"></div></section>
</main>
<main id="pers" hidden>
<section class="card" id="psum"></section>
<section class="card"><h2>Nuevo gasto</h2>
<label>Monto ($)</label><input id="pa" inputmode="decimal">
<label>En qué (luz, mercado, tarjeta...)</label><input id="pn">
<button class="btn" id="addp">Agregar gasto</button></section>
<section class="card"><h2>Gastos del mes</h2><div id="plist"></div><p class="muted">No anotes aquí la gasolina del carro: ya se cuenta en Trabajo.</p></section>
<section class="card"><h2>Copia de seguridad</h2><div class="two"><button class="btn2" id="exp">Exportar</button><button class="btn2" id="impb">Importar</button></div><input type="file" id="imp" accept="application/json,.json" hidden><p class="muted">Importar suma lo que falte; nunca borra lo que ya tienes.</p></section>
</main>
<script>
//LOGIC-START
const KEY='sd_tracker_v1';
const RESERVA_MILLA=0.15; // $ por milla para mantenimiento, llantas y reparaciones (sin gasolina). Cambiarla solo afecta a los turnos NUEVOS.
const fin=n=>typeof n==='number'&&Number.isFinite(n);
const num=v=>{if(v===null||v===undefined)return null;const t=String(v).trim().replace(',','.');if(t==='')return null;const n=Number(t);return Number.isFinite(n)?n:null;};
const okd=d=>Number.isFinite(new Date(d).getTime());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const vs=s=>!!s&&fin(s.startOdo)&&fin(s.endOdo)&&fin(s.earned)&&s.earned>=0&&s.endOdo>s.startOdo&&okd(s.start)&&okd(s.end)&&new Date(s.end)>=new Date(s.start);
const vf=f=>!!f&&fin(f.odo)&&f.odo>=0&&fin(f.gal)&&f.gal>0&&fin(f.paid)&&f.paid>=0&&okd(f.date);
function gas(fills){const f=fills.filter(vf).sort((a,b)=>a.odo-b.odo);let last=null,gal=0,cost=0,mi=0,G=0,C=0,n=0,bad=0;
 for(const x of f){if(last){gal+=x.gal;cost+=x.paid;}
  if(x.full!==false){if(last){const d=x.odo-last.odo,m=gal>0?d/gal:0;if(d>0&&m>=5&&m<=80){mi+=d;G+=gal;C+=cost;n++;}else bad++;}last=x;gal=0;cost=0;}}
 return n?{pending:false,cpm:C/mi,mpg:mi/G,n,bad}:{pending:true,n:0,bad};}
function period(kind,ref){const d=new Date(ref||Date.now());d.setHours(0,0,0,0);const a=new Date(d);let b;
 if(kind==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a);b.setDate(b.getDate()+7);}
 else{a.setDate(1);b=new Date(a);b.setMonth(b.getMonth()+1);}
 return[a,b];}
const inP=(iso,p)=>{const t=new Date(iso).getTime();return t>=p[0].getTime()&&t<p[1].getTime();};
function sc(s){const mi=s.endOdo-s.startOdo,h=(new Date(s.end)-new Date(s.start))/36e5;
 const gc=fin(s.cpm)?mi*s.cpm:null,rv=fin(s.reserve)&&s.reserve>=0?s.reserve:0;
 return{mi,h,e:s.earned,gc,rv,net:gc!==null?s.earned-gc-rv:null};}
function sumP(D,p){const r={n:0,e:0,mi:0,h:0,gc:0,rv:0,net:0,ng:0,nn:0};
 D.shifts.filter(s=>vs(s)&&inP(s.start,p)).map(sc).forEach(x=>{r.n++;r.e+=x.e;r.mi+=x.mi;r.h+=x.h;r.rv+=x.rv;
  if(x.gc!==null){r.gc+=x.gc;r.net+=x.net;}else{r.ng++;r.nn++;}});
 r.complete=r.nn===0;return r;}
function resTotal(D){return D.shifts.filter(vs).reduce((a,s)=>a+sc(s).rv,0);}
function norm(raw){const o=raw&&typeof raw==='object'?raw:{},A=a=>Array.isArray(a)?a:[],ob=x=>x&&typeof x==='object';
 return{v:2,active:ob(o.active)&&fin(o.active.startOdo)&&okd(o.active.start)?{start:o.active.start,startOdo:o.active.startOdo}:null,
 shifts:A(o.shifts).filter(ob).map(s=>({...s,id:s.id||uid()})),
 fills:A(o.fills).filter(ob).map(f=>({...f,id:f.id||uid(),full:f.full!==false})),
 personal:A(o.personal).filter(ob).map(p=>({...p,id:p.id||uid(),type:p.type==='ingreso'?'ingreso':'gasto'})),
 range:o.range==='month'?'month':'week',
 };}
// Devuelve cuántos valores completó. Solo rellena lo que falta; nunca sobrescribe una reserva o un costo de gasolina ya guardados (0 también cuenta como guardado).
function migrate(D){let c=0;const g=gas(D.fills);if(!g.pending)D.shifts.forEach(s=>{if(!fin(s.cpm)){s.cpm=g.cpm;s.mpg=g.mpg;c++;}});
 D.shifts.forEach(s=>{if(!fin(s.reserve)&&vs(s)){s.reserve=(s.endOdo-s.startOdo)*RESERVA_MILLA;c++;}});return c;}
// Carga los datos, migra y, si la migración cambió algo, lo GUARDA de inmediato. Antes de la primera escritura deja una copia intacta de lo que había.
function loadState(st){let D,raw=null;
 try{raw=st.getItem(KEY);if(raw&&!st.getItem(KEY+'_pre2'))st.setItem(KEY+'_pre2',raw);if(raw&&!st.getItem(KEY+'_pre3'))st.setItem(KEY+'_pre3',raw);D=norm(raw?JSON.parse(raw):null);}catch(e){D=norm(null);}
 const c=migrate(D);
 if(c>0&&raw){try{if(!st.getItem(KEY+'_pre_migracion'))st.setItem(KEY+'_pre_migracion',raw);st.setItem(KEY,JSON.stringify(D));}catch(e){}}
 return D;}
function mergeIn(D,raw){const N=norm(raw);['shifts','fills','personal'].forEach(k=>{const ids=new Set(D[k].map(x=>x.id));N[k].forEach(x=>{if(!ids.has(x.id)){D[k].push(x);ids.add(x.id);}});});
 if(!D.active&&N.active)D.active=N.active;return D;}
//LOGIC-END
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(n<0?'-$':'$')+Math.abs(n).toFixed(2);
const tf=i=>new Date(i).toLocaleTimeString('es-US',{hour:'numeric',minute:'2-digit'});
const df=i=>new Date(i).toLocaleDateString('es-US',{weekday:'short',day:'numeric',month:'short'});
let S;
try{S=loadState(localStorage);}catch(e){S=norm(null);migrate(S);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('No se pudo guardar en este navegador');}}
let tab='work';
function toast(t){$('msg').textContent=t;setTimeout(()=>{$('msg').textContent='';},3500);}
function arm(b,fn){let a=false;b.onclick=()=>{if(a){fn();return;}a=true;b.textContent='¿Seguro?';setTimeout(()=>{a=false;b.textContent=b.dataset.l;},2500);};}
function tick(){const el=$('el');if(!el||!S.active)return;const m=Math.max(0,Math.floor((Date.now()-new Date(S.active.start))/6e4));el.textContent=Math.floor(m/60)+' h '+(m%60)+' min';}
setInterval(tick,20000);
function rShift(){const a=S.active;
if(!a){$('shift').innerHTML='<h2>Turno</h2><label>Odómetro al salir de casa</label><input id="so" inputmode="decimal" placeholder="Ej. 84250"><button class="btn" id="go">Empezar turno</button>';
$('go').onclick=()=>{const o=num($('so').value);if(o===null||o<0)return toast('Pon un odómetro válido');const me=Math.max(0,...S.shifts.filter(vs).map(s=>s.endOdo));if(o<me)return toast('El odómetro es menor al del último turno ('+me+')');S.active={start:new Date().toISOString(),startOdo:o};save();rAll();};}
else{$('shift').innerHTML='<h2>Turno en curso</h2><p class="muted">Empezó a las '+tf(a.start)+' · <span id="el"></span> · salió con '+a.startOdo+' mi</p><label>Odómetro al llegar a casa</label><input id="eo" inputmode="decimal"><label>Ganancia del día ($)</label><input id="ea" inputmode="decimal"><button class="btn" id="fin">Terminar turno</button><button class="link" id="can" data-l="Cancelar turno">Cancelar turno</button>';tick();
$('fin').onclick=()=>{const o=num($('eo').value),e=num($('ea').value);if(o===null||o<=a.startOdo)return toast('El odómetro final debe ser mayor al inicial');if(o-a.startOdo>1000)return toast('Más de 1,000 millas en un turno: revisa el odómetro');if(e===null||e<0)return toast('Pon lo que ganaste (0 o más)');
const g=gas(S.fills);S.shifts.push({id:uid(),start:a.start,end:new Date().toISOString(),startOdo:a.startOdo,endOdo:o,earned:e,cpm:g.pending?null:g.cpm,mpg:g.pending?null:g.mpg,reserve:(o-a.startOdo)*RESERVA_MILLA});S.active=null;save();rAll();toast('Turno guardado');};
arm($('can'),()=>{S.active=null;save();rAll();});}}
function rStats(){const p=period(S.range),x=sumP(S,p),g=gas(S.fills),w=S.range==='week';
const nph=x.complete&&x.n>0&&x.h>0?x.net/x.h:null,bph=x.h>0?x.e/x.h:null;
const gt=x.n===0?'—':(x.ng===x.n?'Pendiente':money(x.gc)+(x.ng?'*':''));
const K=(l,v)=>'<div class="k"><span>'+l+'</span><b>'+v+'</b></div>';
let h='<div class="seg"><button data-r="week" class="'+(w?'on':'')+'">Esta semana</button><button data-r="month" class="'+(w?'':'on')+'">Este mes</button></div>';
h+='<div class="muted">Ganancia neta por hora (estimada)</div><div class="big'+(nph!==null&&nph<0?' neg':'')+'">'+(nph!==null?money(nph):(x.n?'Pendiente':'—'))+'</div>';
h+='<div class="grid">'+K('Ganado',money(x.e))+K('Gasolina (est.)',gt)+K('Neto',x.n===0?'—':(x.complete?money(x.net):'Pendiente'))+K('Horas',x.h.toFixed(1))+K('Millas',Math.round(x.mi))+K('Bruto por hora',bph!==null?money(bph):'—')+'</div>';
h+='<p class="muted">Neto = ganado − gasolina − reserva de desgaste.</p>';
if(g.pending)h+='<p class="muted">Gasolina pendiente: necesito 2 llenadas completas seguidas con datos consistentes.'+(g.bad?' ('+g.bad+' ciclo(s) descartado(s) por inconsistentes.)':'')+'</p>';
else if(x.ng&&x.ng<x.n)h+='<p class="muted">* '+x.ng+' turno(s) sin gasolina estimada.</p>';
$('stats').innerHTML=h;
$('stats').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.range=b.dataset.r;save();rAll();});}
function rResv(){const K=(l,v)=>'<div class="k"><span>'+l+'</span><b>'+v+'</b></div>',w=sumP(S,period('week')),m=sumP(S,period('month'));
$('resv').innerHTML='<h2>Reserva para reparaciones</h2><div class="grid">'+K('Esta semana',money(w.rv))+K('Este mes',money(m.rv))+K('Total acumulado',money(resTotal(S)))+'</div><p class="muted">Lo que deberías apartar para mantenimiento, llantas y reparaciones: '+money(RESERVA_MILLA)+' por milla (la gasolina va aparte).</p>';}
function rFill(){const g=gas(S.fills),f=[...S.fills].filter(vf).sort((a,b)=>b.odo-a.odo).slice(0,3);
$('fillinfo').innerHTML=g.pending?'<p class="muted">Estimación pendiente: con 2 llenadas completas seguidas calculo tu costo por milla.</p>':'<div class="grid"><div class="k"><span>Rendimiento real</span><b>'+g.mpg.toFixed(1)+' MPG</b></div><div class="k"><span>Gasolina por milla</span><b>'+money(g.cpm)+'</b></div></div><p class="muted">Basado en '+g.n+' ciclo(s)'+(g.bad?' · '+g.bad+' descartado(s)':'')+'.</p>';
$('fills').innerHTML=f.map(x=>'<div class="row"><div>'+df(x.date)+'<small>'+x.odo+' mi · '+x.gal+' gal'+(x.full===false?' · parcial':'')+'</small></div><div><b>'+money(x.paid)+'</b> <button class="x" data-l="Borrar" data-f="'+x.id+'">Borrar</button></div></div>').join('');
$('fills').querySelectorAll('[data-f]').forEach(b=>arm(b,()=>{S.fills=S.fills.filter(x=>x.id!==b.dataset.f);save();rAll();}));}
function rList(){const l=S.shifts.filter(vs).sort((a,b)=>new Date(b.start)-new Date(a.start)).slice(0,10);
$('list').innerHTML=l.length?l.map(s=>{const c=sc(s);return '<div class="row"><div>'+df(s.start)+'<small>'+c.mi+' mi · '+c.h.toFixed(1)+' h · '+(c.net!==null?'neto '+money(c.net):'neto pendiente')+'</small></div><div><b>'+money(s.earned)+'</b> <button class="x" data-l="Borrar" data-d="'+s.id+'">Borrar</button></div></div>';}).join(''):'<p class="muted">Aún no hay turnos.</p>';
$('list').querySelectorAll('[data-d]').forEach(b=>arm(b,()=>{S.shifts=S.shifts.filter(x=>x.id!==b.dataset.d);save();rAll();}));}
function rPers(){const p=period('month'),x=sumP(S,p),P=S.personal.filter(i=>fin(i.amount)&&okd(i.date)&&inP(i.date,p));
const pt=P.reduce((a,i)=>a+i.amount,0),left=x.complete?x.net-pt:null;
const K=(l,v)=>'<div class="k"><span>'+l+'</span><b>'+v+'</b></div>';
$('psum').innerHTML='<h2>Resumen de '+p[0].toLocaleDateString('es-US',{month:'long',year:'numeric'})+'</h2><div class="grid">'+K('Ganado (Spark)',money(x.e))+K('Gasolina (est.)',x.n===0?money(0):(x.ng===x.n?'Pendiente':money(x.gc)+(x.ng?'*':'')))+K('Reserva de desgaste',money(x.rv))+K('Gastos personales',money(pt))+K('Te queda (est.)',left!==null?money(left):'Pendiente')+'</div><p class="muted">Es una estimación, no tu saldo bancario.</p>';
const l=[...P].sort((a,b)=>new Date(b.date)-new Date(a.date));
$('plist').innerHTML=l.length?l.map(i=>'<div class="row"><div>'+esc(i.note||'Gasto')+'<small>'+df(i.date)+'</small></div><div><b>'+money(i.amount)+'</b> <button class="x" data-l="Borrar" data-p="'+i.id+'">Borrar</button></div></div>').join(''):'<p class="muted">Aún no hay gastos este mes.</p>';
$('plist').querySelectorAll('[data-p]').forEach(b=>arm(b,()=>{S.personal=S.personal.filter(x=>x.id!==b.dataset.p);save();rAll();}));}
$('addf').onclick=()=>{const o=num($('fo').value),gl=num($('fg').value),p=num($('fp').value);
if(o===null||o<0||gl===null||gl<=0||p===null||p<0)return toast('Llena odómetro, galones y lo que pagaste');
const pg=p/gl;if(pg<0.5||pg>15)return toast('Revisa galones y monto: el precio por galón sale raro');
if(S.fills.some(f=>f.odo===o))return toast('Ya hay una llenada con ese odómetro');
S.fills.push({id:uid(),date:new Date().toISOString(),odo:o,gal:gl,paid:p,full:$('ff').checked});['fo','fg','fp'].forEach(i=>$(i).value='');$('ff').checked=true;migrate(S);save();rAll();toast('Llenada guardada');};
$('addp').onclick=()=>{const a=num($('pa').value);if(a===null||a<=0)return toast('Pon un monto mayor a 0');S.personal.push({id:uid(),date:new Date().toISOString(),amount:a,note:$('pn').value.trim()});$('pa').value='';$('pn').value='';save();rAll();toast('Guardado');};
$('exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='gastos-spark-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);};
$('impb').onclick=()=>$('imp').click();
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j!=='object'||!['shifts','fills','personal'].some(k=>Array.isArray(j[k])))throw 0;const n0=S.shifts.length+S.fills.length+S.personal.length;mergeIn(S,j);migrate(S);save();rAll();toast('Importado: '+(S.shifts.length+S.fills.length+S.personal.length-n0)+' registro(s) nuevo(s)');}catch(x){toast('Archivo no válido');}e.target.value='';};r.readAsText(f);};
function rTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('work').hidden=tab!=='work';$('pers').hidden=tab!=='pers';}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;rTabs();});
function rAll(){rShift();rStats();rResv();rFill();rList();rPers();rTabs();}
rAll();
</script></body></html>
